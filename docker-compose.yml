services:
  hub:
    build: { context: ., dockerfile: docker/Dockerfile }
    image: holberton-self-learning-hub:dev
    # Container listens on 0.0.0.0; the host publishes loopback only (D-036).
    ports: ["127.0.0.1:${HUB_PORT:-3000}:3000"]
    environment:
      HUB_MODE: ${HUB_MODE:-local}
      # Port the browser uses; needed for the Host check and printed links (D-046).
      HUB_PUBLIC_PORT: ${HUB_PORT:-3000}
      # HUB_IMPORT_DIR: /import
      # HUB_LINKED_VAULT: /linked
      # Encrypts AI keys at rest (ADR-008). Keep it outside the data folder, e.g. in .env.
      # HUB_SECRET_KEY: ${HUB_SECRET_KEY}
    volumes:
      - ${HUB_DATA:-./.data}:/data
      # Optional read-only linked vault (D-062). Uncomment this line and HUB_LINKED_VAULT above, and set LINKED_VAULT in .env.
      # A missing host folder makes Docker create an empty one; the Hub then reports the vault as empty and changes nothing.
      # - ${LINKED_VAULT}:/linked:ro
      # Optional import folder (D-061): its subfolders can be copied into the vault from Settings.
      # Uncomment both lines and set IMPORT_DIR in .env.
      # - ${IMPORT_DIR}:/import:ro
    # Lets the container reach Ollama on the host as http://host.docker.internal:11434/v1 (Linux needs this line).
    # Ollama must listen on an address the container can reach (OLLAMA_HOST), not only 127.0.0.1.
    extra_hosts: ["host.docker.internal:host-gateway"]
    user: "${UID:-1000}:${GID:-1000}"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
