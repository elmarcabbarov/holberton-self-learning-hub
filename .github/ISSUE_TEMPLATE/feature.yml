name: Feature / task
description: A scoped piece of work (one PR)
title: "HSLH-xxx: "
labels: [phase-1]
body:
  - type: textarea
    id: scope
    attributes: { label: Scope, description: What is in and what is explicitly out. }
    validations: { required: true }
  - type: textarea
    id: ac
    attributes: { label: Acceptance criteria, description: Each one should map to a test. }
    validations: { required: true }
  - type: input
    id: refs
    attributes: { label: References, description: "DECISIONS rows, spec sections" }
